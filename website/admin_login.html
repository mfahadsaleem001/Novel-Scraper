<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Novel Archive</title>

    <link
        rel="stylesheet"
        href="admin_login.css"
    >
</head>

<body>

    <main class="admin-login-page">

        <section class="admin-login-card">

            <div class="brand-mark">
                NA
            </div>

            <p class="eyebrow">
                NOVEL ARCHIVE
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="login-description">
                Sign in to manage your novel collection.
            </p>

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="login-button"
                >
                    <span id="loginButtonText">
                        Sign In
                    </span>
                </button>

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>

            </form>

            <div class="login-footer">

                <span>
                    Authorized administration only
                </span>

            </div>

        </section>

    </main>

    <script src="admin_login.js"></script>

</body>

</html>
