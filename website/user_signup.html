<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Novel Archive | Create Account
    </title>

    <link
        rel="stylesheet"
        href="user_signup.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">


            <!-- ==================================================
                 BRAND
                 ================================================== -->

            <div class="auth-brand">

                <div class="brand-mark">
                    NA
                </div>

                <div class="brand-text">

                    <strong>
                        Novel Archive
                    </strong>

                    <span>
                        Your Personal Reading Space
                    </span>

                </div>

            </div>


            <!-- ==================================================
                 SIGNUP CARD
                 ================================================== -->

            <div class="auth-card">


                <!-- ==================================================
                     HEADING
                     ================================================== -->

                <div class="auth-heading">

                    <span class="auth-label">
                        WELCOME
                    </span>

                    <h1>
                        Create Your Account
                    </h1>

                    <p>
                        Join Novel Archive and start
                        discovering your next story.
                    </p>

                </div>


                <!-- ==================================================
                     MESSAGE
                     ================================================== -->

                <div
                    id="signupMessage"
                    class="auth-message"
                ></div>


                <!-- ==================================================
                     SIGNUP FORM
                     ================================================== -->

                <form id="signupForm">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="text"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="signupConfirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="text"
                            id="signupConfirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- ==================================================
                         CREATE ACCOUNT BUTTON
                         ================================================== -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>


                </form>


                <!-- ==================================================
                     SIGN IN
                     ================================================== -->

                <div class="auth-switch">

                    <span>
                        Already have an account?
                    </span>

                    <a href="user_signin.html">
                        Sign In
                    </a>

                </div>


            </div>


            <!-- ==================================================
                 FOOTER
                 ================================================== -->

            <div class="auth-footer">

                <span>
                    Novel Archive
                </span>

                <span>
                    Read. Discover. Enjoy.
                </span>

            </div>


        </section>

    </main>


    <!-- ==========================================================
         JAVASCRIPT
         ========================================================== -->

    <script src="user_signup.js"></script>

</body>

</html>
