<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novel Archive | Novel Details</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ============================================================
           NOVEL DETAILS PAGE
           ============================================================ */

        :root {
            --novel-burgundy: #6f1d3a;
            --novel-burgundy-dark: #4a1026;
            --novel-burgundy-soft: #f1e4e8;
            --novel-ivory: #f7f1e7;
            --novel-paper: #fffdf8;
            --novel-charcoal: #292525;
            --novel-muted: #756c67;
            --novel-gold: #b18a52;
            --novel-border: #ded4c8;
        }


        /* ============================================================
           PAGE
           ============================================================ */

        body {
            background: var(--novel-ivory);
            color: var(--novel-charcoal);
        }


        /* ============================================================
           HEADER
           ============================================================ */

        .header {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 14px 5%;
            background: var(--novel-charcoal);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--novel-burgundy);
            color: var(--novel-ivory);
            font-family: "Manrope", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-text {
            color: var(--novel-ivory);
            font-family: "Cormorant Garamond", serif;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .header-text {
            color: rgba(247, 241, 231, 0.72);
            font-family: "Manrope", sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-align: right;
        }


        /* ============================================================
           MAIN
           ============================================================ */

        .main-container {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
            padding: 42px 0 70px;
        }


        /* ============================================================
           LOADING / ERROR
           ============================================================ */

        #loading,
        #error {
            width: 100%;
            padding: 28px;
            margin: 20px 0;
            border: 1px solid var(--novel-border);
            border-radius: 14px;
            background: var(--novel-paper);
            text-align: center;
            font-family: "Manrope", sans-serif;
        }

        #loading {
            color: var(--novel-muted);
        }

        #error {
            color: var(--novel-burgundy);
            background: var(--novel-burgundy-soft);
            border-color: rgba(111, 29, 58, 0.2);
        }


        /* ============================================================
           NOVEL CONTENT
           ============================================================ */

        #novelContent {
            display: none;
        }


        /* ============================================================
           NOVEL DETAIL HEADER
           ============================================================ */

        .novel-detail-header {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            gap: 44px;
            padding: 38px;
            background: var(--novel-paper);
            border: 1px solid var(--novel-border);
            border-radius: 18px;
            box-shadow:
                0 10px 35px rgba(41, 37, 37, 0.05);
        }


        /* ============================================================
           COVER
           ============================================================ */

        .novel-cover-wrapper {
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--novel-ivory);
            border: 1px solid var(--novel-border);
            border-radius: 10px;
        }

        #coverImage {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }


        /* ============================================================
           NOVEL INFORMATION
           ============================================================ */

        .novel-information {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .novel-label {
            display: inline-block;
            margin-bottom: 10px;
            color: var(--novel-gold);
            font-family: "Manrope", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        #novelTitle {
            margin: 0;
            color: var(--novel-charcoal);
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(40px, 5vw, 62px);
            font-weight: 700;
            line-height: 0.98;
        }

        .novel-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 20px;
        }

        .novel-meta span {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 6px 12px;
            background: var(--novel-ivory);
            border: 1px solid var(--novel-border);
            border-radius: 20px;
            color: var(--novel-muted);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;
        }

        #novelStatus {
            background: var(--novel-burgundy-soft);
            border-color: rgba(111, 29, 58, 0.16);
            color: var(--novel-burgundy);
        }

        .novel-author-line {
            margin: 16px 0 0;
            color: var(--novel-muted);
            font-family: "Manrope", sans-serif;
            font-size: 14px;
        }

        .novel-author-line strong {
            color: var(--novel-charcoal);
        }


        /* ============================================================
           SYNOPSIS
           ============================================================ */

        .synopsis-section {
            margin-top: 26px;
            padding-top: 24px;
            border-top: 1px solid var(--novel-border);
        }

        .synopsis-section h2,
        .chapters-section h2 {
            margin: 0 0 12px;
            color: var(--novel-charcoal);
            font-family: "Cormorant Garamond", serif;
            font-size: 28px;
            font-weight: 700;
        }

        #novelSynopsis {
            margin: 0;
            color: var(--novel-muted);
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            line-height: 1.85;
        }


        /* ============================================================
           CHAPTER SECTION
           ============================================================ */

        .chapters-section {
            width: 100%;
            margin-top: 30px;
            padding: 34px;
            background: var(--novel-paper);
            border: 1px solid var(--novel-border);
            border-radius: 18px;
            box-sizing: border-box;
        }

        .chapters-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .chapters-heading h2 {
            margin-bottom: 0;
        }

        #chapterCount {
            color: var(--novel-muted);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;
        }


        /* ============================================================
           CHAPTER LIST
           Full available width — same visual width as synopsis area
           ============================================================ */

        #chaptersList {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 0;
        }


        /* ============================================================
           PROFESSIONAL CHAPTER BUTTON
           ============================================================ */

        .chapter-button {
            width: 100%;
            min-height: 68px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 13px;
            box-sizing: border-box;
            background: var(--novel-paper);
            border: 1px solid var(--novel-border);
            border-radius: 12px;
            color: var(--novel-charcoal);
            font-family: "Manrope", sans-serif;
            text-align: left;
            cursor: pointer;
            box-shadow:
                0 2px 7px
                rgba(41, 37, 37, 0.025);
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .chapter-button:hover {
            background: var(--novel-ivory);
            border-color: var(--novel-gold);
            transform: translateY(-2px);
            box-shadow:
                0 8px 20px
                rgba(41, 37, 37, 0.08);
        }

        .chapter-button:active {
            transform: translateY(0);
        }

        .chapter-button:focus-visible {
            outline:
                2px solid
                var(--novel-gold);
            outline-offset: 2px;
        }

        .chapter-number {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--novel-burgundy-soft);
            border: 1px solid rgba(111, 29, 58, 0.15);
            border-radius: 10px;
            color: var(--novel-burgundy);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .chapter-info {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chapter-label {
            color: var(--novel-muted);
            font-family: "Manrope", sans-serif;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .chapter-title {
            overflow: hidden;
            color: var(--novel-charcoal);
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chapter-arrow {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--novel-burgundy);
            font-size: 18px;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .chapter-button:hover .chapter-arrow {
            background: var(--novel-burgundy-soft);
            transform: translateX(3px);
        }


        /* ============================================================
           CHAPTER PAGINATION
           ============================================================ */

        #chapterPagination {
            display: none;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 26px;
        }

        #chapterPagination.visible {
            display: flex;
        }

        .chapter-page-button {
            min-width: 42px;
            height: 42px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--novel-border);
            border-radius: 8px;
            background: var(--novel-paper);
            color: var(--novel-charcoal);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .chapter-page-button:hover:not(:disabled) {
            background: var(--novel-ivory);
            border-color: var(--novel-gold);
            color: var(--novel-burgundy);
            transform: translateY(-1px);
        }

        .chapter-page-button.active {
            background: var(--novel-burgundy);
            border-color: var(--novel-burgundy);
            color: var(--novel-ivory);
        }

        .chapter-page-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .chapter-page-button.previous,
        .chapter-page-button.next {
            padding: 0 16px;
        }

        .chapter-page-ellipsis {
            min-width: 24px;
            color: var(--novel-muted);
            font-family: "Manrope", sans-serif;
            font-weight: 700;
            text-align: center;
        }


        /* ============================================================
           PROFESSIONAL READER MODAL
           ============================================================ */

        #readerModal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                rgba(41, 37, 37, 0.86);
            backdrop-filter: blur(7px);
            overflow-y: auto;
        }

        #readerModal.active {
            display: flex;
        }


        /* ============================================================
           READER CONTAINER
           ============================================================ */

        .reader-container {
            width: min(1120px, 100%);
            height: min(900px, calc(100vh - 48px));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--novel-paper);
            border:
                1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.35);
        }


        /* ============================================================
           READER HEADER
           ============================================================ */

        .reader-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px 28px;
            background: var(--novel-charcoal);
            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);
        }

        #readerTitle {
            margin: 0;
            color: var(--novel-ivory);
            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            font-weight: 700;
            line-height: 1.2;
        }

        #closeReader {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border:
                1px solid rgba(247, 241, 231, 0.22);
            border-radius: 50%;
            background: transparent;
            color: var(--novel-ivory);
            font-size: 24px;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        #closeReader:hover {
            background: var(--novel-burgundy);
            border-color: var(--novel-burgundy);
        }


        /* ============================================================
           READER CHAPTER LIST
           ============================================================ */

        #readerChapterList {
            display: none;
            flex-shrink: 0;
            max-height: 180px;
            overflow-y: auto;
            padding: 16px 24px;
            background: var(--novel-paper);
            border-bottom:
                1px solid var(--novel-border);
        }

        #readerChapterList.active {
            display: block;
        }

        #readerChapters {
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        #readerChapters button {
            min-height: 38px;
            padding: 8px 14px;
            border:
                1px solid var(--novel-border);
            border-radius: 7px;
            background: var(--novel-ivory);
            color: var(--novel-charcoal);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        #readerChapters button:hover {
            background: var(--novel-burgundy);
            border-color: var(--novel-burgundy);
            color: var(--novel-ivory);
        }


        /* ============================================================
           READER BODY
           ============================================================ */

        .reader-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: var(--novel-ivory);
        }


        /* ============================================================
           READING CONTENT
           ============================================================ */

        #readerContent {
            width: min(760px, 100%);
            margin: 0 auto;
            padding: 58px 36px 75px;
            color: #3b3531;
            font-family:
                "Cormorant Garamond",
                Georgia,
                "Times New Roman",
                serif;
            font-size: 20px;
            line-height: 1.95;
            letter-spacing: 0.1px;
        }

        #readerContent p {
            margin: 0 0 24px;
        }

        #readerContent h1,
        #readerContent h2,
        #readerContent h3 {
            margin: 0 0 28px;
            color: var(--novel-burgundy);
            font-family:
                "Cormorant Garamond",
                serif;
            font-weight: 700;
            line-height: 1.3;
        }

        #readerContent strong {
            color: var(--novel-charcoal);
        }


        /* ============================================================
           READER NAVIGATION
           ============================================================ */

        .reader-navigation {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 14px;
            padding: 15px 24px;
            background: var(--novel-paper);
            border-top:
                1px solid var(--novel-border);
        }

        .reader-navigation button {
            min-height: 42px;
            padding: 9px 18px;
            border:
                1px solid var(--novel-border);
            border-radius: 8px;
            background: var(--novel-paper);
            color: var(--novel-charcoal);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .reader-navigation button:hover {
            background: var(--novel-ivory);
            border-color: var(--novel-gold);
            color: var(--novel-burgundy);
            transform: translateY(-1px);
        }

        #chapterListButton {
            background: var(--novel-burgundy);
            border-color: var(--novel-burgundy);
            color: var(--novel-ivory);
        }

        #chapterListButton:hover {
            background: var(--novel-burgundy-dark);
            border-color: var(--novel-burgundy-dark);
            color: var(--novel-ivory);
        }

        #previousChapter {
            justify-self: start;
        }

        #chapterListButton {
            justify-self: center;
        }

        #nextChapter {
            justify-self: end;
        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 850px) {

            .main-container {
                width: min(calc(100% - 32px), 700px);
                padding-top: 28px;
            }

            .novel-detail-header {
                grid-template-columns:
                    210px minmax(0, 1fr);
                gap: 28px;
                padding: 26px;
            }

            .chapters-section {
                padding: 26px;
            }

            #readerContent {
                font-size: 18px;
                line-height: 1.85;
                padding:
                    46px 30px 60px;
            }

            .reader-container {
                width: min(100%, 950px);
            }
        }


        @media (max-width: 650px) {

            .header {
                padding: 12px 18px;
            }

            .logo-text {
                font-size: 24px;
            }

            .header-text {
                display: none;
            }

            .main-container {
                width: calc(100% - 24px);
                padding:
                    20px 0 45px;
            }

            .novel-detail-header {
                grid-template-columns: 1fr;
                gap: 25px;
                padding: 20px;
            }

            .novel-cover-wrapper {
                width: min(230px, 100%);
                margin: 0 auto;
            }

            #novelTitle {
                font-size: 43px;
            }

            .chapters-section {
                padding: 20px;
            }

            .chapters-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 5px;
            }

            #chaptersList {
                grid-template-columns: 1fr;
            }

            #chapterPagination {
                gap: 6px;
            }

            .chapter-page-button {
                min-width: 38px;
                height: 38px;
                padding: 0 9px;
                font-size: 11px;
            }

            .chapter-page-button.previous,
            .chapter-page-button.next {
                padding: 0 11px;
            }


            /* Reader */

            #readerModal {
                padding: 10px;
            }

            .reader-container {
                width: 100%;
                height:
                    calc(100vh - 20px);
                max-height:
                    calc(100vh - 20px);
                border-radius: 12px;
            }

            .reader-header {
                padding: 15px 17px;
            }

            #readerTitle {
                font-size: 24px;
            }

            #closeReader {
                width: 38px;
                height: 38px;
                font-size: 22px;
            }

            #readerChapterList {
                max-height: 145px;
                padding:
                    12px 14px;
            }

            #readerContent {
                width: 100%;
                padding:
                    38px 22px 55px;
                font-size: 18px;
                line-height: 1.85;
            }

            .reader-navigation {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 11px 12px;
            }

            #chapterListButton {
                grid-column: 1 / -1;
                grid-row: 1;
                width: 100%;
            }

            #previousChapter {
                grid-column: 1;
                grid-row: 2;
                width: 100%;
            }

            #nextChapter {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
            }
        }


        @media (max-width: 420px) {

            .logo-mark {
                width: 38px;
                height: 38px;
            }

            .logo-text {
                font-size: 22px;
            }

            #novelTitle {
                font-size: 38px;
            }

            .novel-detail-header {
                padding: 16px;
            }

            .chapters-section {
                padding: 16px;
            }

            #readerContent {
                padding:
                    32px 18px 45px;
                font-size: 17px;
                line-height: 1.8;
            }

            .reader-navigation button {
                font-size: 11px;
                padding:
                    9px 10px;
            }
        }

    </style>

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <span class="logo-mark">
                NA
            </span>

            <span class="logo-text">
                Novel Archive
            </span>

        </div>

        <div class="header-text">
            Your Personal Reading Space
        </div>

    </header>


    <!-- MAIN -->

    <main class="main-container">


        <!-- LOADING -->

        <div id="loading">
            ⏳ Loading novel...
        </div>


        <!-- ERROR -->

        <div id="error" style="display: none;">
            ❌ Unable to load novel.
        </div>


        <!-- NOVEL CONTENT -->

        <section id="novelContent">


            <!-- NOVEL INFORMATION -->

            <section class="novel-detail-header">


                <!-- COVER -->

                <div class="novel-cover-wrapper">

                    <img
                        id="coverImage"
                        src=""
                        alt="Novel Cover"
                    >

                </div>


                <!-- INFORMATION -->

                <div class="novel-information">

                    <span class="novel-label">
                        NOVEL DETAILS
                    </span>

                    <h1 id="novelTitle">
                        Novel Title
                    </h1>

                    <p class="novel-author-line">

                        Written by

                        <strong id="novelAuthor">
                            Unknown Author
                        </strong>

                    </p>


                    <div class="novel-meta">

                        <span id="novelGenre">
                            Genre
                        </span>

                        <span id="novelStatus">
                            Status
                        </span>

                    </div>


                    <!-- SYNOPSIS -->

                    <div class="synopsis-section">

                        <h2>
                            Synopsis
                        </h2>

                        <p id="novelSynopsis">
                            No synopsis available.
                        </p>

                    </div>

                </div>

            </section>


            <!-- CHAPTERS -->

            <section class="chapters-section">

                <div class="chapters-heading">

                    <div>

                        <span class="novel-label">
                            READING
                        </span>

                        <h2>
                            Chapters
                        </h2>

                    </div>

                    <span id="chapterCount">
                        0 Chapters
                    </span>

                </div>


                <!-- EXISTING CHAPTER LIST -->

                <div id="chaptersList">
                    <!-- Chapters inserted by script.js -->
                </div>


                <!-- CHAPTER PAGINATION -->

                <div
                    id="chapterPagination"
                    aria-label="Chapter pagination"
                >
                    <!-- Pagination buttons inserted automatically -->
                </div>

            </section>

        </section>

    </main>

         READER MODAL

    <div id="readerModal">

        <div class="reader-container">


            <!-- READER HEADER -->

            ).get("file");

        if (!novelParameter) {

            window.location.href =
                "index.html";

        }

    </script>


    <!-- EXISTING SCRIPT -->

    <script src="script.js"></script>


    <!-- ============================================================
         CHAPTER PAGINATION
         ============================================================ -->

    <script>

        (() => {

            const chaptersList =
                document.getElementById(
                    "chaptersList"
                );

            const pagination =
                document.getElementById(
                    "chapterPagination"
                );

            if (!chaptersList || !pagination) {
                return;
            }


            const CHAPTERS_PER_PAGE = 50;

            let currentPage = 1;

            let chapters = [];


            function getChapterElements() {

                return Array.from(
                    chaptersList.children
                ).filter(element => {

                    return (
                        element.nodeType === 1
                    );

                });

            }


            function createPageButton(
                label,
                page,
                className = ""
            ) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type = "button";

                button.className =
                    `chapter-page-button ${className}`.trim();

                button.textContent = label;


                if (page === currentPage) {

                    button.classList.add(
                        "active"
                    );

                    button.setAttribute(
                        "aria-current",
                        "page"
                    );

                }


                button.addEventListener(
                    "click",
                    () => {

                        if (
                            page >= 1 &&
                            page <= getTotalPages()
                        ) {

                            currentPage = page;

                            renderPagination();

                            renderChapterPage();

                            chaptersList.scrollIntoView({
                                behavior: "smooth",
                                block: "start"
                            });

                        }

                    }
                );


                return button;

            }


            function getTotalPages() {

                if (chapters.length === 0) {
                    return 0;
                }

                return Math.ceil(
                    chapters.length /
                    CHAPTERS_PER_PAGE
                );

            }


            function addPageNumber(page) {

                pagination.appendChild(
                    createPageButton(
                        page,
                        page
                    )
                );

            }


            function addEllipsis() {

                const span =
                    document.createElement(
                        "span"
                    );

                span.className =
                    "chapter-page-ellipsis";

                span.textContent = "…";

                span.setAttribute(
                    "aria-hidden",
                    "true"
                );

                pagination.appendChild(span);

            }


            function renderPagination() {

                const totalPages =
                    getTotalPages();

                pagination.innerHTML = "";


                if (totalPages <= 1) {

                    pagination.classList.remove(
                        "visible"
                    );

                    return;

                }


                pagination.classList.add(
                    "visible"
                );


                /* Previous */

                const previous =
                    createPageButton(
                        "← Previous",
                        currentPage - 1,
                        "previous"
                    );

                previous.disabled =
                    currentPage === 1;

                pagination.appendChild(
                    previous
                );


                /*
                 * Page number strategy:
                 *
                 * 1 2 3 4 5 ... 10
                 *
                 * or
                 *
                 * 1 ... 4 5 6 ... 10
                 */


                if (totalPages <= 7) {

                    for (
                        let page = 1;
                        page <= totalPages;
                        page++
                    ) {

                        addPageNumber(page);

                    }

                } else {

                    addPageNumber(1);


                    if (currentPage > 4) {

                        addEllipsis();

                    }


                    const startPage =
                        Math.max(
                            2,
                            currentPage - 1
                        );

                    const endPage =
                        Math.min(
                            totalPages - 1,
                            currentPage + 1
                        );


                    for (
                        let page = startPage;
                        page <= endPage;
                        page++
                    ) {

                        addPageNumber(page);

                    }


                    if (
                        currentPage <
                        totalPages - 3
                    ) {

                        addEllipsis();

                    }


                    addPageNumber(
                        totalPages
                    );

                }


                /* Next */

                const next =
                    createPageButton(
                        "Next →",
                        currentPage + 1,
                        "next"
                    );

                next.disabled =
                    currentPage === totalPages;

                pagination.appendChild(
                    next
                );

            }


            function renderChapterPage() {

                const totalPages =
                    getTotalPages();


                if (totalPages === 0) {

                    pagination.classList.remove(
                        "visible"
                    );

                    return;

                }


                if (currentPage < 1) {
                    currentPage = 1;
                }


                if (currentPage > totalPages) {

                    currentPage =
                        totalPages;

                }


                const start =
                    (currentPage - 1) *
                    CHAPTERS_PER_PAGE;

                const end =
                    start +
                    CHAPTERS_PER_PAGE;


                chapters.forEach(
                    (chapter, index) => {

                        const pageStart =
                            start;

                        const pageEnd =
                            end;

                        const shouldShow =
                            index >= pageStart &&
                            index < pageEnd;

                        chapter.style.display =
                            shouldShow
                                ? ""
                                : "none";

                    }
                );


                renderPagination();

            }


            function initializePagination() {

                const newChapters =
                    getChapterElements();


                if (
                    newChapters.length === 0
                ) {

                    return false;

                }


                if (
                    newChapters.length !==
                        chapters.length ||

                    newChapters.some(
                        (chapter, index) =>
                            chapter !==
                            chapters[index]
                    )
                ) {

                    chapters =
                        newChapters;

                    currentPage = 1;

                    renderChapterPage();

                }


                return true;

            }


            /*
             * script.js dynamically inserts
             * chapter buttons.
             *
             * MutationObserver detects them
             * without changing script.js.
             */

            const observer =
                new MutationObserver(
                    () => {

                        initializePagination();

                    }
                );


            observer.observe(
                chaptersList,
                {
                    childList: true
                }
            );


            /*
             * Initial check
             */

            initializePagination();

        })();

    </script>
    <script src="back-button.js"></script>

</body>
