<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novel Archive | Novel Details</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ============================================================
           NOVEL DETAILS PAGE
           ============================================================ */

        :root {
            --novel-burgundy: #6f1d3a;
            --novel-burgundy-dark: #4a1026;
            --novel-burgundy-soft: #f1e4e8;
            --novel-ivory: #f7f1e7;
            --novel-paper: #fffdf8;
            --novel-charcoal: #292525;
            --novel-muted: #756c67;
            --novel-gold: #b18a52;
            --novel-border: #ded4c8;
        }


        /* ============================================================
           PAGE
           ============================================================ */

        body {
            background: var(--novel-ivory);
            color: var(--novel-charcoal);
        }


        /* ============================================================
           HEADER
           ============================================================ */

        .header {
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            padding: 14px 5%;

            background: var(--novel-charcoal);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo-mark {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: var(--novel-burgundy);
            color: var(--novel-ivory);

            font-family: "Manrope", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-text {
            color: var(--novel-ivory);

            font-family: "Cormorant Garamond", serif;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .header-text {
            color: rgba(247, 241, 231, 0.72);

            font-family: "Manrope", sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-align: right;
        }


        /* ============================================================
           MAIN
           ============================================================ */

        .main-container {
            width: min(1180px, calc(100% - 48px));

            margin: 0 auto;

            padding: 42px 0 70px;
        }


        /* ============================================================
           LOADING / ERROR
           ============================================================ */

        #loading,
        #error {
            width: 100%;

            padding: 28px;
            margin: 20px 0;

            border: 1px solid var(--novel-border);
            border-radius: 14px;

            background: var(--novel-paper);

            text-align: center;

            font-family: "Manrope", sans-serif;
        }

        #loading {
            color: var(--novel-muted);
        }

        #error {
            color: var(--novel-burgundy);

            background: var(--novel-burgundy-soft);

            border-color: rgba(111, 29, 58, 0.2);
        }


        /* ============================================================
           NOVEL CONTENT
           ============================================================ */

        #novelContent {
            display: none;
        }


        /* ============================================================
           NOVEL DETAIL HEADER
           ============================================================ */

        .novel-detail-header {
            display: grid;

            grid-template-columns: 270px minmax(0, 1fr);

            gap: 44px;

            padding: 38px;

            background: var(--novel-paper);

            border: 1px solid var(--novel-border);
            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(41, 37, 37, 0.05);
        }


        /* ============================================================
           COVER
           ============================================================ */

        .novel-cover-wrapper {
            width: 100%;

            aspect-ratio: 2 / 3;

            overflow: hidden;

            background: var(--novel-ivory);

            border: 1px solid var(--novel-border);
            border-radius: 10px;
        }

        #coverImage {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
        }


        /* ============================================================
           NOVEL INFORMATION
           ============================================================ */

        .novel-information {
            min-width: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .novel-label {
            display: inline-block;

            margin-bottom: 10px;

            color: var(--novel-gold);

            font-family: "Manrope", sans-serif;
            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        #novelTitle {
            margin: 0;

            color: var(--novel-charcoal);

            font-family: "Cormorant Garamond", serif;
            font-size: clamp(40px, 5vw, 62px);

            font-weight: 700;
            line-height: 0.98;
        }

        .novel-meta {
            display: flex;
            flex-wrap: wrap;

            gap: 9px;

            margin-top: 20px;
        }

        .novel-meta span {
            display: inline-flex;
            align-items: center;

            min-height: 32px;

            padding: 6px 12px;

            background: var(--novel-ivory);

            border: 1px solid var(--novel-border);
            border-radius: 20px;

            color: var(--novel-muted);

            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;
        }

        #novelStatus {
            background: var(--novel-burgundy-soft);

            border-color: rgba(111, 29, 58, 0.16);

            color: var(--novel-burgundy);
        }

        .novel-author-line {
            margin: 16px 0 0;

            color: var(--novel-muted);

            font-family: "Manrope", sans-serif;
            font-size: 14px;
        }

        .novel-author-line strong {
            color: var(--novel-charcoal);
        }


        /* ============================================================
           SYNOPSIS
           ============================================================ */

        .synopsis-section {
            margin-top: 26px;

            padding-top: 24px;

            border-top: 1px solid var(--novel-border);
        }

        .synopsis-section h2,
        .chapters-section h2 {
            margin: 0 0 12px;

            color: var(--novel-charcoal);

            font-family: "Cormorant Garamond", serif;
            font-size: 28px;
            font-weight: 700;
        }

        #novelSynopsis {
            margin: 0;

            color: var(--novel-muted);

            font-family: "Manrope", sans-serif;
            font-size: 14px;
            line-height: 1.85;
        }


        /* ============================================================
           CHAPTER SECTION
           ============================================================ */

        .chapters-section {
            margin-top: 30px;

            padding: 34px;

            background: var(--novel-paper);

            border: 1px solid var(--novel-border);
            border-radius: 18px;
        }

        .chapters-heading {
            display: flex;

            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 22px;
        }

        .chapters-heading h2 {
            margin-bottom: 0;
        }

        #chapterCount {
            color: var(--novel-muted);

            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;
        }

        #chaptersList {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 12px;

            max-width: 920px;

            margin: 0 auto;
        }

        .chapter-button {
            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding: 14px 18px;

            background: var(--novel-ivory);

            border: 1px solid var(--novel-border);
            border-radius: 10px;

            color: var(--novel-charcoal);

            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 600;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .chapter-button:hover {
            background: var(--novel-burgundy-soft);

            border-color: var(--novel-gold);

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(41, 37, 37, 0.07);
        }


        /* ============================================================
           PROFESSIONAL READER MODAL
           ============================================================ */

        #readerModal {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                rgba(41, 37, 37, 0.86);

            backdrop-filter: blur(7px);

            overflow-y: auto;
        }

        #readerModal.active {
            display: flex;
        }


        /* ============================================================
           READER CONTAINER
           ============================================================ */

        .reader-container {
            width: min(1120px, 100%);

            height: min(900px, calc(100vh - 48px));

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: var(--novel-paper);

            border:
                1px solid rgba(255, 255, 255, 0.12);

            border-radius: 16px;

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.35);
        }


        /* ============================================================
           READER HEADER
           ============================================================ */

        .reader-header {
            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px 28px;

            background: var(--novel-charcoal);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);
        }

        #readerTitle {
            margin: 0;

            color: var(--novel-ivory);

            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            font-weight: 700;

            line-height: 1.2;
        }

        #closeReader {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(247, 241, 231, 0.22);

            border-radius: 50%;

            background: transparent;

            color: var(--novel-ivory);

            font-size: 24px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        #closeReader:hover {
            background: var(--novel-burgundy);

            border-color: var(--novel-burgundy);
        }


        /* ============================================================
           READER CHAPTER LIST
           ============================================================ */

        #readerChapterList {
            display: none;

            flex-shrink: 0;

            max-height: 180px;

            overflow-y: auto;

            padding: 16px 24px;

            background: var(--novel-paper);

            border-bottom:
                1px solid var(--novel-border);
        }

        #readerChapterList.active {
            display: block;
        }

        #readerChapters {
            max-width: 950px;

            margin: 0 auto;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;
        }

        #readerChapters button {
            min-height: 38px;

            padding: 8px 14px;

            border:
                1px solid var(--novel-border);

            border-radius: 7px;

            background: var(--novel-ivory);

            color: var(--novel-charcoal);

            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        #readerChapters button:hover {
            background: var(--novel-burgundy);

            border-color: var(--novel-burgundy);

            color: var(--novel-ivory);
        }


        /* ============================================================
           READER BODY
           ============================================================ */

        .reader-body {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            background: var(--novel-ivory);
        }


        /* ============================================================
           READING CONTENT
           ============================================================ */

        #readerContent {
            width: min(760px, 100%);

            margin: 0 auto;

            padding: 58px 36px 75px;

            color: #3b3531;

            font-family:
                "Cormorant Garamond",
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;

            line-height: 1.95;

            letter-spacing: 0.1px;
        }

        #readerContent p {
            margin: 0 0 24px;
        }

        #readerContent h1,
        #readerContent h2,
        #readerContent h3 {
            margin: 0 0 28px;

            color: var(--novel-burgundy);

            font-family:
                "Cormorant Garamond",
                serif;

            font-weight: 700;

            line-height: 1.3;
        }

        #readerContent strong {
            color: var(--novel-charcoal);
        }


        /* ============================================================
           READER NAVIGATION
           ============================================================ */

        .reader-navigation {
            flex-shrink: 0;

            display: grid;

            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            gap: 14px;

            padding: 15px 24px;

            background: var(--novel-paper);

            border-top:
                1px solid var(--novel-border);
        }

        .reader-navigation button {
            min-height: 42px;

            padding: 9px 18px;

            border:
                1px solid var(--novel-border);

            border-radius: 8px;

            background: var(--novel-paper);

            color: var(--novel-charcoal);

            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .reader-navigation button:hover {
            background: var(--novel-ivory);

            border-color: var(--novel-gold);

            color: var(--novel-burgundy);

            transform: translateY(-1px);
        }

        #chapterListButton {
            background: var(--novel-burgundy);

            border-color: var(--novel-burgundy);

            color: var(--novel-ivory);
        }

        #chapterListButton:hover {
            background: var(--novel-burgundy-dark);

            border-color: var(--novel-burgundy-dark);

            color: var(--novel-ivory);
        }

        #previousChapter {
            justify-self: start;
        }

        #chapterListButton {
            justify-self: center;
        }

        #nextChapter {
            justify-self: end;
        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 850px) {

            .main-container {
                width: min(100% - 32px, 700px);

                padding-top: 28px;
            }

            .novel-detail-header {
                grid-template-columns:
                    210px minmax(0, 1fr);

                gap: 28px;

                padding: 26px;
            }

            .chapters-section {
                padding: 26px;
            }

            #readerContent {
                font-size: 18px;

                line-height: 1.85;

                padding:
                    46px 30px 60px;
            }

            .reader-container {
                width: min(100%, 950px);
            }
        }


        @media (max-width: 650px) {

            .header {
                padding: 12px 18px;
            }

            .logo-text {
                font-size: 24px;
            }

            .header-text {
                display: none;
            }

            .main-container {
                width: calc(100% - 24px);

                padding:
                    20px 0 45px;
            }

            .novel-detail-header {
                grid-template-columns: 1fr;

                gap: 25px;

                padding: 20px;
            }

            .novel-cover-wrapper {
                width: min(230px, 100%);

                margin: 0 auto;
            }

            #novelTitle {
                font-size: 43px;
            }

            .chapters-section {
                padding: 20px;
            }

            .chapters-heading {
                align-items: flex-start;

                flex-direction: column;

                gap: 5px;
            }

            #chaptersList {
                grid-template-columns: 1fr;
            }


            /* Reader */

            #readerModal {
                padding: 10px;
            }

            .reader-container {
                width: 100%;

                height:
                    calc(100vh - 20px);

                max-height:
                    calc(100vh - 20px);

                border-radius: 12px;
            }

            .reader-header {
                padding: 15px 17px;
            }

            #readerTitle {
                font-size: 24px;
            }

            #closeReader {
                width: 38px;
                height: 38px;

                font-size: 22px;
            }

            #readerChapterList {
                max-height: 145px;

                padding:
                    12px 14px;
            }

            #readerContent {
                width: 100%;

                padding:
                    38px 22px 55px;

                font-size: 18px;

                line-height: 1.85;
            }

            .reader-navigation {
                grid-template-columns: 1fr 1fr;

                gap: 8px;

                padding: 11px 12px;
            }

            #chapterListButton {
                grid-column: 1 / -1;

                grid-row: 1;

                width: 100%;
            }

            #previousChapter {
                grid-column: 1;

                grid-row: 2;

                width: 100%;
            }

            #nextChapter {
                grid-column: 2;

                grid-row: 2;

                width: 100%;
            }
        }


        @media (max-width: 420px) {

            .logo-mark {
                width: 38px;
                height: 38px;
            }

            .logo-text {
                font-size: 22px;
            }

            #novelTitle {
                font-size: 38px;
            }

            .novel-detail-header {
                padding: 16px;
            }

            .chapters-section {
                padding: 16px;
            }

            #readerContent {
                padding:
                    32px 18px 45px;

                font-size: 17px;

                line-height: 1.8;
            }

            .reader-navigation button {
                font-size: 11px;

                padding:
                    9px 10px;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <span class="logo-mark">
                NA
            </span>

            <span class="logo-text">
                Novel Archive
            </span>

        </div>

        <div class="header-text">
            Your Personal Reading Space
        </div>

    </header>


    <!-- MAIN -->

    <main class="main-container">


        <!-- LOADING -->

        <div id="loading">
            ⏳ Loading novel...
        </div>


        <!-- ERROR -->

        <div id="error" style="display: none;">
            ❌ Unable to load novel.
        </div>


        <!-- NOVEL CONTENT -->

        <section id="novelContent">


            <!-- NOVEL INFORMATION -->

            <section class="novel-detail-header">


                <!-- COVER -->

                <div class="novel-cover-wrapper">

                    <img
                        id="coverImage"
                        src=""
                        alt="Novel Cover"
                    >

                </div>


                <!-- INFORMATION -->

                <div class="novel-information">

                    <span class="novel-label">
                        NOVEL DETAILS
                    </span>

                    <h1 id="novelTitle">
                        Novel Title
                    </h1>

                    <p class="novel-author-line">

                        Written by

                        <strong id="novelAuthor">
                            Unknown Author
                        </strong>

                    </p>


                    <div class="novel-meta">

                        <span id="novelGenre">
                            Genre
                        </span>

                        <span id="novelStatus">
                            Status
                        </span>

                    </div>


                    <!-- SYNOPSIS -->

                    <div class="synopsis-section">

                        <h2>
                            Synopsis
                        </h2>

                        <p id="novelSynopsis">
                            No synopsis available.
                        </p>

                    </div>

                </div>

            </section>


            <!-- CHAPTERS -->

            <section class="chapters-section">

                <div class="chapters-heading">

                    <div>

                        <span class="novel-label">
                            READING
                        </span>

                        <h2>
                            Chapters
                        </h2>

                    </div>

                    <span id="chapterCount">
                        0 Chapters
                    </span>

                </div>


                <div id="chaptersList">

                    <!-- Chapters inserted by script.js -->

                </div>

            </section>

        </section>

    </main>


    <!-- ============================================================
         READER MODAL
         ============================================================ -->

    <div id="readerModal">

        <div class="reader-container">


            <!-- READER HEADER -->

            <header class="reader-header">

                <h2 id="readerTitle">
                    Chapter
                </h2>

                <button
                    type="button"
                    id="closeReader"
                    aria-label="Close reader"
                >
                    ×
                </button>

            </header>


            <!-- CHAPTER LIST -->

            <section
                id="readerChapterList"
                class="reader-chapter-list"
            >

                <div id="readerChapters">

                    <!-- Reader chapters inserted by script.js -->

                </div>

            </section>


            <!-- READER BODY -->

            <div class="reader-body">

                <article id="readerContent">

                    <!-- Chapter content inserted by script.js -->

                </article>

            </div>


            <!-- READER NAVIGATION -->

            <nav class="reader-navigation">

                <button
                    type="button"
                    id="previousChapter"
                >
                    ← Previous
                </button>

                <button
                    type="button"
                    id="chapterListButton"
                >
                    ☰ Chapters
                </button>

                <button
                    type="button"
                    id="nextChapter"
                >
                    Next →
                </button>

            </nav>

        </div>

    </div>


    <!-- ============================================================
         NOVEL PARAMETER CHECK
         ============================================================ -->

    <script>

        const novelParameter =
            new URLSearchParams(
                window.location.search
            ).get("file");

        if (!novelParameter) {

            window.location.href =
                "index.html";

        }

    </script>


    <!-- EXISTING SCRIPT -->

    <script src="script.js"></script>


</body>

</html>
