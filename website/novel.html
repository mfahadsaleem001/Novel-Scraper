<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Novel Reader</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            📚 Novel Reader
        </div>

        <div class="header-text">
            Your Personal Reading Space
        </div>

    </header>


    <!-- =====================================================
         MAIN NOVEL CONTAINER
    ====================================================== -->

    <main class="novel-container">

        <!-- BACK BUTTON -->

        <a
            href="index.html"
            class="back-button"
        >
            ← Back to Library
        </a>


        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loading"
            class="loading"
        >
            ⏳ Loading novel...
        </div>


        <!-- =================================================
             ERROR
        ================================================== -->

        <div
            id="error"
            class="error-box"
            style="display: none;"
        ></div>


        <!-- =================================================
             NOVEL CONTENT
        ================================================== -->

        <div
            id="novelContent"
            style="display: none;"
        >

            <!-- =============================================
                 NOVEL HEADER
            ============================================== -->

            <section class="novel-header">

                <div class="cover-wrapper">

                    <img
                        id="coverImage"
                        class="novel-cover"
                        src=""
                        alt="Novel Cover"
                    >

                </div>


                <div class="novel-info">

                    <h1 id="novelTitle">
                        Untitled Novel
                    </h1>


                    <div class="meta">

                        <p>
                            <strong>Author</strong>
                            <span id="novelAuthor">
                                Unknown
                            </span>
                        </p>


                        <p>
                            <strong>Genre</strong>
                            <span id="novelGenre">
                                Unknown
                            </span>
                        </p>


                        <p>
                            <strong>Status</strong>
                            <span id="novelStatus">
                                Unknown
                            </span>
                        </p>


                        <p>
                            <strong>Chapters</strong>
                            <span id="novelChapters">
                                0
                            </span>
                        </p>

                    </div>

                </div>

            </section>


            <!-- =============================================
                 SYNOPSIS
            ============================================== -->

            <section class="synopsis-section">

                <h2>
                    📖 Synopsis
                </h2>

                <p id="novelSynopsis">
                    No synopsis available.
                </p>

            </section>


            <!-- =============================================
                 CHAPTERS
            ============================================== -->

            <section class="chapters-section">

                <div class="section-heading">

                    <h2>
                        📚 Chapters
                    </h2>

                    <span id="chapterCount">
                        0 Chapters
                    </span>

                </div>


                <div
                    id="chaptersList"
                    class="chapters-list"
                ></div>

            </section>

        </div>

    </main>


    <!-- =====================================================
         READER MODAL
    ====================================================== -->

    <div
        id="readerModal"
        class="reader-modal"
        style="display: none;"
    >

        <div class="reader-box">

            <!-- =============================================
                 READER HEADER
            ============================================== -->

            <div class="reader-header">

                <h2 id="readerTitle">
                    Chapter
                </h2>


                <button
                    id="closeReader"
                    class="close-button"
                    type="button"
                    aria-label="Close reader"
                >
                    ✕
                </button>

            </div>


            <!-- =============================================
                 CHAPTER LIST PANEL
            ============================================== -->

            <div
                id="readerChapterList"
                class="reader-chapter-list"
                style="display: none;"
            >

                <div class="reader-chapter-list-header">

                    <h3>
                        📚 Chapter List
                    </h3>

                    <button
                        id="closeChapterList"
                        class="close-chapter-list"
                        type="button"
                        aria-label="Close chapter list"
                    >
                        ✕
                    </button>

                </div>


                <div
                    id="readerChapters"
                    class="reader-chapters"
                ></div>

            </div>


            <!-- =============================================
                 READER CONTENT
            ============================================== -->

            <div
                id="readerContent"
                class="reader-content"
            ></div>


            <!-- =============================================
                 READER NAVIGATION
            ============================================== -->

            <div class="reader-navigation">

                <button
                    id="previousChapter"
                    class="reader-nav-button previous-chapter"
                    type="button"
                >
                    ← Previous Chapter
                </button>


                <button
                    id="chapterListButton"
                    class="reader-nav-button chapter-list-button"
                    type="button"
                >
                    📚 Chapter List
                </button>


                <button
                    id="nextChapter"
                    class="reader-nav-button next-chapter"
                    type="button"
                >
                    Next Chapter →
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
