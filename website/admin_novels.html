<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>All Novels | Novel Archive</title>

<link
    rel="stylesheet"
    href="admin_dashboard.css"
>

<style>

    .novels-page {
        padding: 42px;
    }

    .novels-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin: 30px 0;
        padding: 20px;
        background: var(--paper);
        border: 1px solid var(--border);
    }

    .search-box {
        flex: 1;
    }

    .search-box input,
    .filter-box select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        background: var(--ivory);
        color: var(--charcoal);
        outline: none;
    }

    .filter-box {
        width: 180px;
    }

    .admin-novels-grid {
        display: grid;
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .admin-novel-card {
        display: flex;
        gap: 18px;
        padding: 18px;
        background: var(--paper);
        border: 1px solid var(--border);
    }

    .admin-novel-cover {
        width: 90px;
        height: 120px;
        flex-shrink: 0;
        object-fit: cover;
        background: var(--ivory);
    }

    .admin-novel-info {
        flex: 1;
        min-width: 0;
    }

    .admin-novel-info h3 {
        margin: 0 0 7px;
        font-family: Georgia, serif;
        font-size: 19px;
        font-weight: 500;
    }

    .admin-novel-info p {
        margin: 5px 0;
        color: var(--muted);
        font-size: 13px;
    }

    .novel-status {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 9px;
        background: var(--burgundy-soft);
        color: var(--burgundy);
        font-size: 11px;
        font-weight: 700;
    }

    .admin-novel-actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
    }

    .admin-novel-actions button {
        border: none;
        padding: 9px 12px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
    }

    .read-admin-btn {
        background: var(--burgundy);
        color: white;
    }

    .edit-admin-btn {
        background: var(--charcoal);
        color: white;
    }

    .delete-admin-btn {
        background: #eee5df;
        color: #8b243f;
    }

    .empty-admin-novels {
        padding: 60px 20px;
        text-align: center;
        background: var(--paper);
        border: 1px solid var(--border);
    }

    .empty-admin-novels h3 {
        font-family: Georgia, serif;
        margin-bottom: 8px;
    }

    .empty-admin-novels p {
        color: var(--muted);
    }

    @media (max-width: 900px) {

        .novels-page {
            padding: 25px;
        }

        .admin-novels-grid {
            grid-template-columns: 1fr;
        }

    }

    @media (max-width: 600px) {

        .novels-toolbar {
            flex-direction: column;
            align-items: stretch;
        }

        .filter-box {
            width: 100%;
        }

        .admin-novel-card {
            flex-direction: column;
        }

    }

</style>

</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->

    <aside class="admin-sidebar">

        <div class="sidebar-brand">

            <div class="brand-mark">
                NA
            </div>

            <div>

                <h2>Novel Archive</h2>

                <span>
                    Administration
                </span>

            </div>

        </div>


        <nav class="admin-navigation">

            <p class="nav-label">
                MANAGEMENT
            </p>

            <a
                href="admin_dashboard.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ⌂
                </span>

                <span>
                    Dashboard
                </span>

            </a>


            <a
                href="admin_novels.html"
                class="nav-item active"
            >

                <span class="nav-icon">
                    ▤
                </span>

                <span>
                    All Novels
                </span>

            </a>


            <a
                href="scraper.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ⌕
                </span>

                <span>
                    Scrape Novel
                </span>

            </a>


            <a
                href="manual_novel.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ＋
                </span>

                <span>
                    Add Novel
                </span>

            </a>


            <p class="nav-label nav-label-spaced">
                SYSTEM
            </p>


            <a
                href="admin_users.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ♙
                </span>

                <span>
                    Users
                </span>

            </a>


            <a
                href="admin_settings.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ⚙
                </span>

                <span>
                    Settings
                </span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="admin-profile">

                <div class="profile-avatar">
                    A
                </div>

                <div class="profile-info">

                    <strong>
                        Administrator
                    </strong>

                    <span>
                        Admin Account
                    </span>

                </div>

            </div>


            <button
                class="logout-button"
                type="button"
                onclick="window.location.href='admin_login.html'"
            >
                Logout
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="admin-main">

        <div class="novels-page">

            <header class="dashboard-header">
                <link rel="stylesheet" href="back-button.css">

                <div>

                    <p class="page-eyebrow">
                        COLLECTION
                    </p>

                    <h1>
                        All Novels
                    </h1>

                    <p class="page-description">
                        Manage every novel in your collection.
                    </p>

                </div>

            </header>


            <!-- TOOLBAR -->

            <section class="novels-toolbar">

                <div class="search-box">

                    <input
                        type="search"
                        id="novelSearch"
                        placeholder="Search by title or author..."
                    >

                </div>


                <div class="filter-box">

                    <select id="statusFilter">

                        <option value="all">
                            All Status
                        </option>

                        <option value="Ongoing">
                            Ongoing
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>

            </section>


            <!-- NOVELS -->

            <section
                id="adminNovelsContainer"
                class="admin-novels-grid"
            >
            </section>

        </div>

    </main>

</div>


<script src="admin_novels.js"></script>

<script src="back-button.js"></script>

</body>

</html>
