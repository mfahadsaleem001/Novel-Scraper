<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Novel Archive | Sign In
    </title>

    <link
        rel="stylesheet"
        href="user_signin.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">


            <!-- ==================================================
                 BRAND
                 ================================================== -->

            <div class="auth-brand">

                <div class="brand-mark">
                    NA
                </div>

                <div class="brand-text">

                    <strong>
                        Novel Archive
                    </strong>

                    <span>
                        Your Personal Reading Space
                    </span>

                </div>

            </div>


            <!-- ==================================================
                 SIGN IN CARD
                 ================================================== -->

            <div class="auth-card">


                <!-- ==================================================
                     HEADING
                     ================================================== -->

                <div class="auth-heading">

                    <span class="auth-label">
                        WELCOME BACK
                    </span>

                    <h1>
                        Sign In
                    </h1>

                    <p>
                        Sign in to continue exploring
                        your reading collection.
                    </p>

                </div>


                <!-- ==================================================
                     MESSAGE
                     ================================================== -->

                <div
                    id="signinMessage"
                    class="auth-message"
                ></div>


                <!-- ==================================================
                     SIGN IN FORM
                     ================================================== -->

                <form id="signinForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="signinEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signinEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="signinPassword">
                            Password
                        </label>

                        <input
                            type="text"
                            id="signinPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- ==================================================
                         SIGN IN BUTTON
                         ================================================== -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Sign In
                    </button>


                </form>


                <!-- ==================================================
                     CREATE ACCOUNT
                     ================================================== -->

                <div class="auth-switch">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="user_signup.html">
                        Create Account
                    </a>

                </div>


            </div>


            <!-- ==================================================
                 FOOTER
                 ================================================== -->

            <div class="auth-footer">

                <span>
                    Novel Archive
                </span>

                <span>
                    Read. Discover. Enjoy.
                </span>

            </div>


        </section>

    </main>


    <!-- ==========================================================
         JAVASCRIPT
         ========================================================== -->

    <script src="user_signin.js"></script>

</body>

</html>
